  <title>The main course page </title>
  <style>


    body {
  overflow-y: scroll;
  overflow-x: hidden;
}

    :root{
      --bg1:#291357; /* very dark navy */
      --bg2:#01203a; /* deep blue */
      --card-bg: rgba(8,20,35,0.36);
      --accent: #0f2731;
      --electric: #231495;
      --glass-border: rgba(172, 53, 53, 0.06);
      --glass-highlight: rgba(86, 27, 27, 0.05);
      
    }
    /* Reset */
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family: Inter, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      color: #e6f7ff;
      background: radial-gradient(1200px 600px at 10% 10%, rgba(31, 44, 230, 0.25), transparent),
                  linear-gradient(180deg,var(--bg1), var(--bg2));
      display:flex;align-items:center;justify-content:center;
      padding:40px;
   
      direction:rtl;
    }

    /* Electric animated frame around the page */
    .electric-frame{
      position:relative;
      width:100%;max-width:1200px;
      padding:40px;
      border-radius:18px;
      overflow:visible;
    }

    /* soft glow behind */
    .electric-frame:before{
      content:"";position:absolute;inset:-12px;border-radius:22px;
      background: conic-gradient(from 180deg, rgba(161, 58, 153, 0.06), rgba(54,198,255,0.06));
      filter: blur(18px);
      z-index:0;
      pointer-events:none;
    }

    /* 'lightning' animated strokes on edges using SVG filter strip */
    .electric-frame:after{
      content:"";position:absolute;inset:0;border-radius:18px;z-index:2;
      background: linear-gradient(90deg, transparent, rgba(116,240,255,0.02) 30%, transparent);
      box-shadow: 0 0 60px rgba(54,198,255,0.06) inset;
      pointer-events:none;
      mix-blend-mode:screen;
      animation: pulse 4s linear infinite;
    }
    pre {
  white-space: pre-wrap;
  word-break: break-word;
  overflow-wrap:break-word ;
  max-width: 100%;
  box-sizing: border-box;
}
    @keyframes pulse{0%{opacity:0.6}50%{opacity:1}100%{opacity:0.6}}

    /* Decorative animated sparks along the edges */
    .spark{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--electric);box-shadow:0 0 12px var(--electric);opacity:0.85;animation:zap 1.6s linear infinite}
    .spark.s1{top:-6px;left:6%;animation-delay:0.0s}
    .spark.s2{top:-6px;left:40%;animation-delay:0.2s}
    .spark.s3{top:-6px;left:72%;animation-delay:0.4s}
    .spark.s4{bottom:-6px;left:18%;animation-delay:0.7s}
    .spark.s5{bottom:-6px;left:58%;animation-delay:0.5s}
    .spark.s6{left:-6px;top:30%;animation-delay:0.3s}
    .spark.s7{right:-6px;top:60%;animation-delay:0.6s}
    @keyframes zap{0%{transform:translateY(0) scale(0.8)}50%{transform:translateY(6px) scale(1.2);opacity:1}100%{transform:translateY(0) scale(0.8);opacity:0.5}}

    /* Container for header and cards */
    .panel{position:relative;z-index:3;display:flex;flex-direction:column;gap:28px}

    header{display:flex;align-items:center;justify-content:space-between;gap:16px}
    header h1{font-size:20px;letter-spacing:0.6px}
    header p{opacity:0.8}

    /* cards grid */
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}

    /* Glass card */
    .card{
      background: linear-gradient(180deg, rgba(57, 25, 182, 0.25), rgba(146, 38, 160, 0.28));
      border:1px solid var(--glass-border);
      padding:22px;border-radius:14px;backdrop-filter: blur(8px);-webkit-backdrop-filter: blur(8px);
      box-shadow: 0 6px 30px rgba(14, 50, 122, 0.6);
      position:relative;overflow:hidden;min-height:220px;display:flex;flex-direction:column;gap:12px;
    }

    /* subtle electric glow inside card corners */
    .card:before{
      content:"";position:absolute;inset:-40% -40%;background:radial-gradient(ellipse at top left, rgba(116,240,255,0.06), transparent 20%);
      transform:rotate(-20deg);pointer-events:none
    }

    .card-top{display:flex;align-items:center;gap:14px}
    .avatar{width:76px;height:76px;border-radius:50%;overflow:hidden;border:3px solid rgba(19, 69, 74, 0.12);flex:0 0 76px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01))}
    .avatar img{width:100%;height:100%;object-fit:cover;display:block}

    .meta{flex:1}
    .meta h3{margin-bottom:4px;font-size:16px}
    .meta p{font-size:13px;opacity:0.85}

    /* rating */
    .stars{display:flex;gap:6px;align-items:center}
    .star{font-size:20px;cursor:pointer;filter:drop-shadow(0 2px 6px rgba(0,0,0,0.6));transition:transform .12s}
    .star:hover{transform:scale(1.12)}
    .star.on{color:var(--accent);text-shadow:0 6px 18px rgba(54,198,255,0.12)}
    .star.off{color:rgba(255,255,255,0.14)}

    .desc{margin-top:6px;font-size:14px;line-height:1.4;opacity:0.95}

    /* small electricity bolt icon near title */
    .bolt{width:18px;height:18px;display:inline-block;vertical-align:middle;margin-left:8px}

@media (max-width:600px){
  body{
    padding:20px;             /* قلل البادينج */
    display:flex;              /* محتفظ بالflex بس نخليه عمودي */
    flex-direction:column;     /* رص العناصر فوق بعض */
    align-items:flex-start;    /* يبدأ من فوق */
    justify-content:flex-start; /* محتوى يبدأ من فوق */
  }

  .electric-frame{
    padding:20px;             /* قلل padding للframe */
  }

  .cards{
    grid-template-columns:1fr; /* نفس اللي عندك */
  }

  header{
    flex-direction:column;
    align-items:flex-start;    /* نفس اللي عندك */
  }
}

    
  
</style>

  <script>
    // Initialize stars based on data-rating and make them clickable to set rating
    document.querySelectorAll('.stars').forEach(starBox => {
      const stars = Array.from(starBox.querySelectorAll('.star'));
      const init = parseInt(starBox.getAttribute('data-rating')) || 0;
      const set = (n) => {
        starBox.setAttribute('data-rating', n);
        stars.forEach(s => s.classList.toggle('on', parseInt(s.dataset.value) <= n));
        stars.forEach(s => s.classList.toggle('off', parseInt(s.dataset.value) > n));
      }
      // initial paint
      set(init);

      // click handlers
      stars.forEach(s => {
        s.addEventListener('click', () => set(parseInt(s.dataset.value)));
        s.addEventListener('keydown', (e) => {
          if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); set(parseInt(s.dataset.value)); }
        });
      });

      // keyboard left/right support on the container
      starBox.addEventListener('keydown', (e)=>{
        let cur = parseInt(starBox.getAttribute('data-rating')) || 0;
        if(e.key === 'ArrowRight' || e.key === 'ArrowUp'){ if(cur<5) set(cur+1); }
        if(e.key === 'ArrowLeft' || e.key === 'ArrowDown'){ if(cur>0) set(cur-1); }
      });
    });
